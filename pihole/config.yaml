name: Pi-hole
version: "1.9.1"
slug: pihole
description: Network-wide ad blocking DNS server powered by Pi-hole v6
url: https://github.com/chancemcox/HomeassistantPIhole
arch:
  - aarch64
  - amd64
init: false
ingress: true
# Dynamic port: required with host_network so we do not collide with other
# host-network apps that also default Ingress to 8099 (e.g. HomeScan).
ingress_port: 0
panel_icon: mdi:pi-hole
panel_title: Pi-hole
startup: services
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
hassio_api: true
ports:
  53/tcp: 53
  53/udp: 53
  8088/tcp: 8088
ports_description:
  53/tcp: DNS (TCP)
  53/udp: DNS (UDP)
  8088/tcp: Native Pi-hole admin UI (direct access)
options:
  password: ""
  upstream_dns:
    - 1.1.1.1
    - 1.0.0.1
  dns_listening_mode: ALL
  interface_theme: default
  query_logging: true
  timezone: America/Chicago
  log_level: info
  block_hulu_ads: false
schema:
  password: password?
  upstream_dns:
    - str
  dns_listening_mode: list(ALL|LOCAL|BIND|SINGLE|NONE)
  interface_theme: list(default|default-dark|default-darker|auto)
  query_logging: bool
  timezone: str
  log_level: list(trace|debug|info|warning|error)
  block_hulu_ads: bool
backup_exclude:
  - "**/pihole-FTL.db"
  - "**/pihole-FTL.db-*"
  - "**/list.*"
