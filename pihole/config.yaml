name: Pi-hole
version: "1.10.10"
slug: pihole
description: Network-wide ad blocking DNS server powered by Pi-hole v6
url: https://github.com/chancemcox/HomeassistantPIhole
arch:
  - aarch64
  - amd64
init: false
ingress: true
# Fixed unique port (not 8099): host_network apps share the host, so the HA
# default Ingress port collides with other apps (e.g. HomeScan) and dynamic
# ingress_port: 0 was still causing sidebar 502s when Supervisor lookup failed.
ingress_port: 8189
panel_icon: mdi:pi-hole
panel_title: Pi-hole
startup: services
host_network: true
# Share host PIDs so port-53 owner errors can name AdGuardHome / systemd-resolved.
host_pid: true
privileged:
  - NET_ADMIN
  - NET_RAW
# manager role is required to GET /addons and name which peer owns port 53.
hassio_api: true
hassio_role: manager
ports:
  53/tcp: 53
  53/udp: 53
  8088/tcp: 8088
ports_description:
  53/tcp: DNS (TCP)
  53/udp: DNS (UDP)
  8088/tcp: Native Pi-hole admin UI (direct access)
options:
  password: ""
  upstream_dns:
    - 1.1.1.1
    - 1.0.0.1
  dns_listening_mode: ALL
  interface_theme: default-auto
  query_logging: true
  timezone: America/Chicago
  log_level: info
  block_hulu_ads: false
schema:
  password: password?
  upstream_dns:
    - str
  dns_listening_mode: list(ALL|LOCAL|BIND|SINGLE|NONE)
  interface_theme: list(default-auto|default-light|default-dark|default-darker|high-contrast|high-contrast-dark|lcars)
  query_logging: bool
  timezone: str
  log_level: list(trace|debug|info|warning|error)
  block_hulu_ads: bool
backup_exclude:
  - "**/pihole-FTL.db"
  - "**/pihole-FTL.db-*"
  - "**/list.*"
